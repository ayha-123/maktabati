<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الكتب - مكتبتي الإلكترونية</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #243b55;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            font-size: 17px;
        }

        .back {
            max-width: 1100px;
            margin: 20px auto 0;
            padding: 0 20px;
        }

        .back a {
            text-decoration: none;
            color: #243b55;
            font-weight: bold;
        }

        .search {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 20px;
            display: flex;
            gap: 10px;
        }

        .search input {
            flex: 1;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            text-align: right;
        }

        .search button {
            padding: 0 22px;
            border: none;
            border-radius: 12px;
            background: #243b55;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 10px 20px 40px;
        }

        h2 {
            text-align: center;
            margin: 25px 0;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .book-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .cover {
            height: 230px;
            background: #eef1f6;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            margin-bottom: 15px;
        }

        .badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .book-card h3 {
            margin: 10px 0;
            font-size: 22px;
        }

        .author {
            color: #666;
            margin-bottom: 18px;
        }

        .book-button {
            display: inline-block;
            background: #243b55;
            color: white;
            padding: 11px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 15px;
        }

        .no-results {
            display: none;
            background: white;
            padding: 35px 20px;
            border-radius: 16px;
            text-align: center;
            color: #666;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        footer {
            background: #243b55;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 27px;
            }

            .search {
                flex-direction: column;
            }

            .search button {
                padding: 13px;
            }

        }

    </style>
</head>

<body>

    <header>

        <h1>📚 الكتب</h1>

        <p>
            تصفح الكتب المتوفرة في مكتبتي الإلكترونية
        </p>

    </header>


    <div class="back">

        <a href="index.html">
            ← العودة إلى الرئيسية
        </a>

    </div>


    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 ابحث عن اسم الكتاب أو المؤلف..."
            onkeyup="searchBooks()"
        >

        <button onclick="searchBooks()">
            بحث 🔎
        </button>

    </div>


    <main>

        <h2>📖 الكتب المتوفرة</h2>


        <div class="books">

            <!-- كتاب حكمت اليوم -->

            <div
                class="book-card"
                data-title="حكمت اليوم"
                data-author="أيهم حيدر حاكم"
            >

                <div class="cover">
                    📖
                </div>

                <div class="badge">
                    🆓 مجاني
                </div>

                <h3>
                    حكمت اليوم
                </h3>

                <div class="author">
                    تأليف: أيهم حيدر حاكم
                </div>

                <a
                    class="book-button"
                    href="book12.html"
                >
                    عرض الكتاب
                </a>

            </div>

        </div>


        <div
            id="noResults"
            class="no-results"
        >
            لم نجد كتابًا مطابقًا لبحثك 🔎
        </div>

    </main>


    <footer>

        © 2026 مكتبتي الإلكترونية

    </footer>


    <script>

        function searchBooks() {

            var text =
                document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();

            var book =
                document.querySelector(".book-card");

            var title =
                book
                .getAttribute("data-title")
                .toLowerCase();

            var author =
                book
                .getAttribute("data-author")
                .toLowerCase();

            var message =
                document.getElementById("noResults");


            if (
                text === "" ||
                title.includes(text) ||
                author.includes(text)
            ) {

                book.style.display = "block";
                message.style.display = "none";

            } else {

                book.style.display = "none";
                message.style.display = "block";

            }

        }

    </script>

</body>

</html>
