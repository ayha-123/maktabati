<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الكتب | مكتبتي الإلكترونية</title>

<style>

* {
    box-sizing: border-box;
    }

    body {
        margin: 0;
            font-family: Arial, sans-serif;
                background: #f5f7fa;
                    color: #222;
                    }

                    header {
                        background: #172554;
                            color: white;
                                text-align: center;
                                    padding: 30px 15px;
                                    }

                                    header h1 {
                                        margin: 0 0 10px;
                                            font-size: 30px;
                                            }

                                            header p {
                                                margin: 0;
                                                    opacity: 0.9;
                                                    }

                                                    .container {
                                                        max-width: 1100px;
                                                            margin: 30px auto;
                                                                padding: 0 15px;
                                                                }

                                                                .back {
                                                                    display: inline-block;
                                                                        margin-bottom: 25px;
                                                                            color: #172554;
                                                                                text-decoration: none;
                                                                                    font-weight: bold;
                                                                                    }

                                                                                    .top-bar {
                                                                                        margin-bottom: 25px;
                                                                                        }

                                                                                        .top-bar h2 {
                                                                                            margin-bottom: 15px;
                                                                                            }

                                                                                            .search-box {
                                                                                                display: flex;
                                                                                                    gap: 8px;
                                                                                                    }

                                                                                                    .search-box input {
                                                                                                        flex: 1;
                                                                                                            padding: 12px;
                                                                                                                border: 1px solid #ccc;
                                                                                                                    border-radius: 8px;
                                                                                                                        font-size: 15px;
                                                                                                                        }

                                                                                                                        .search-box button {
                                                                                                                            padding: 12px 20px;
                                                                                                                                border: none;
                                                                                                                                    border-radius: 8px;
                                                                                                                                        background: #172554;
                                                                                                                                            color: white;
                                                                                                                                                cursor: pointer;
                                                                                                                                                }

                                                                                                                                                .books-grid {
                                                                                                                                                    display: grid;
                                                                                                                                                        grid-template-columns: repeat(
                                                                                                                                                                auto-fit,
                                                                                                                                                                        minmax(240px, 1fr)
                                                                                                                                                                            );
                                                                                                                                                                                gap: 20px;
                                                                                                                                                                                }

                                                                                                                                                                                .book-card {
                                                                                                                                                                                    background: white;
                                                                                                                                                                                        border-radius: 15px;
                                                                                                                                                                                            overflow: hidden;
                                                                                                                                                                                                box-shadow: 0 5px 18px rgba(0,0,0,0.08);
                                                                                                                                                                                                    transition: 0.2s;
                                                                                                                                                                                                    }

                                                                                                                                                                                                    .book-card:hover {
                                                                                                                                                                                                        transform: translateY(-4px);
                                                                                                                                                                                                        }

                                                                                                                                                                                                        .cover {
                                                                                                                                                                                                            height: 280px;
                                                                                                                                                                                                                background: #e5e7eb;
                                                                                                                                                                                                                    display: flex;
                                                                                                                                                                                                                        justify-content: center;
                                                                                                                                                                                                                            align-items: center;
                                                                                                                                                                                                                                font-size: 70px;
                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                .book-info {
                                                                                                                                                                                                                                    padding: 20px;
                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                    .book-info h3 {
                                                                                                                                                                                                                                        margin-top: 0;
                                                                                                                                                                                                                                            margin-bottom: 10px;
                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                            .author {
                                                                                                                                                                                                                                                color: #666;
                                                                                                                                                                                                                                                    margin-bottom: 15px;
                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                    .badge {
                                                                                                                                                                                                                                                        display: inline-block;
                                                                                                                                                                                                                                                            background: #dcfce7;
                                                                                                                                                                                                                                                                color: #166534;
                                                                                                                                                                                                                                                                    padding: 6px 10px;
                                                                                                                                                                                                                                                                        border-radius: 20px;
                                                                                                                                                                                                                                                                            font-size: 13px;
                                                                                                                                                                                                                                                                                margin-bottom: 15px;
                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                .button {
                                                                                                                                                                                                                                                                                    display: block;
                                                                                                                                                                                                                                                                                        text-align: center;
                                                                                                                                                                                                                                                                                            background: #172554;
                                                                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                                                                    text-decoration: none;
                                                                                                                                                                                                                                                                                                        padding: 12px;
                                                                                                                                                                                                                                                                                                            border-radius: 8px;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                            .no-results {
                                                                                                                                                                                                                                                                                                                display: none;
                                                                                                                                                                                                                                                                                                                    text-align: center;
                                                                                                                                                                                                                                                                                                                        background: white;
                                                                                                                                                                                                                                                                                                                            padding: 30px;
                                                                                                                                                                                                                                                                                                                                border-radius: 15px;
                                                                                                                                                                                                                                                                                                                                    color: #666;
                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                    footer {
                                                                                                                                                                                                                                                                                                                                        margin-top: 50px;
                                                                                                                                                                                                                                                                                                                                            background: #172554;
                                                                                                                                                                                                                                                                                                                                                color: white;
                                                                                                                                                                                                                                                                                                                                                    text-align: center;
                                                                                                                                                                                                                                                                                                                                                        padding: 20px;
                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                        @media (max-width: 600px) {

                                                                                                                                                                                                                                                                                                                                                            .search-box {
                                                                                                                                                                                                                                                                                                                                                                    flex-direction: column;
                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                            .search-box button {
                                                                                                                                                                                                                                                                                                                                                                                    width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                        </style>

                                                                                                                                                                                                                                                                                                                                                                                        </head>

                                                                                                                                                                                                                                                                                                                                                                                        <body>

                                                                                                                                                                                                                                                                                                                                                                                        <header>

                                                                                                                                                                                                                                                                                                                                                                                        <h1>📚 الكتب</h1>

                                                                                                                                                                                                                                                                                                                                                                                        <p>
                                                                                                                                                                                                                                                                                                                                                                                        تصفح الكتب المتوفرة في مكتبتي الإلكترونية
                                                                                                                                                                                                                                                                                                                                                                                        </p>

                                                                                                                                                                                                                                                                                                                                                                                        </header>

                                                                                                                                                                                                                                                                                                                                                                                        <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                        <a class="back" href="index.html">
                                                                                                                                                                                                                                                                                                                                                                                        ← العودة إلى الرئيسية
                                                                                                                                                                                                                                                                                                                                                                                        </a>

                                                                                                                                                                                                                                                                                                                                                                                        <div class="top-bar">

                                                                                                                                                                                                                                                                                                                                                                                        <h2>جميع الكتب</h2>

                                                                                                                                                                                                                                                                                                                                                                                        <div class="search-box">

                                                                                                                                                                                                                                                                                                                                                                                        <input
                                                                                                                                                                                                                                                                                                                                                                                        type="text"
                                                                                                                                                                                                                                                                                                                                                                                        id="searchInput"
                                                                                                                                                                                                                                                                                                                                                                                        placeholder="ابحث عن كتاب أو مؤلف..."
                                                                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="searchBooks()">
                                                                                                                                                                                                                                                                                                                                                                                        بحث
                                                                                                                                                                                                                                                                                                                                                                                        </button>

                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                        <div class="books-grid">

                                                                                                                                                                                                                                                                                                                                                                                        <div
                                                                                                                                                                                                                                                                                                                                                                                        class="book-card"
                                                                                                                                                                                                                                                                                                                                                                                        data-title="حكمت اليوم"
                                                                                                                                                                                                                                                                                                                                                                                        data-author="أيهم حيدر حاكم"
                                                                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                                                                        <div class="cover">
                                                                                                                                                                                                                                                                                                                                                                                        📖
                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                        <div class="book-info">

                                                                                                                                                                                                                                                                                                                                                                                        <span class="badge">
                                                                                                                                                                                                                                                                                                                                                                                        🆓 مجاني
                                                                                                                                                                                                                                                                                                                                                                                        </span>

                                                                                                                                                                                                                                                                                                                                                                                        <h3>
                                                                                                                                                                                                                                                                                                                                                                                        حكمت اليوم
                                                                                                                                                                                                                                                                                                                                                                                        </h3>

                                                                                                                                                                                                                                                                                                                                                                                        <div class="author">
                                                                                                                                                                                                                                                                                                                                                                                        ✍️ أيهم حيدر حاكم
                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                        <a
                                                                                                                                                                                                                                                                                                                                                                                        class="button"
                                                                                                                                                                                                                                                                                                                                                                                        href="book12.html"
                                                                                                                                                                                                                                                                                                                                                                                        >
                                                                                                                                                                                                                                                                                                                                                                                        عرض الكتاب
                                                                                                                                                                                                                                                                                                                                                                                        </a>

                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                        <div
                                                                                                                                                                                                                                                                                                                                                                                        id="noResults"
                                                                                                                                                                                                                                                                                                                                                                                        class="no-results"
                                                                                                                                                                                                                                                                                                                                                                                        >

                                                                                                                                                                                                                                                                                                                                                                                        🔍 لم نجد كتابًا بهذا الاسم.

                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                        <footer>

                                                                                                                                                                                                                                                                                                                                                                                        © 2026 مكتبتي الإلكترونية

                                                                                                                                                                                                                                                                                                                                                                                        </footer>

                                                                                                                                                                                                                                                                                                                                                                                        <script>

                                                                                                                                                                                                                                                                                                                                                                                        function searchBooks() {

                                                                                                                                                                                                                                                                                                                                                                                            var text = document
                                                                                                                                                                                                                                                                                                                                                                                                    .getElementById("searchInput")
                                                                                                                                                                                                                                                                                                                                                                                                            .value
                                                                                                                                                                                                                                                                                                                                                                                                                    .trim()
                                                                                                                                                                                                                                                                                                                                                                                                                            .toLowerCase();

                                                                                                                                                                                                                                                                                                                                                                                                                                var book = document.querySelector(".book-card");

                                                                                                                                                                                                                                                                                                                                                                                                                                    var title = book
                                                                                                                                                                                                                                                                                                                                                                                                                                            .getAttribute("data-title")
                                                                                                                                                                                                                                                                                                                                                                                                                                                    .toLowerCase();

                                                                                                                                                                                                                                                                                                                                                                                                                                                        var author = book
                                                                                                                                                                                                                                                                                                                                                                                                                                                                .getAttribute("data-author")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        .toLowerCase();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            var message = document
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    .getElementById("noResults");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                text === "" ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        title.includes(text) ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                author.includes(text)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            book.style.display = "block";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    message.style.display = "none";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                book.style.display = "none";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        message.style.display = "block";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
