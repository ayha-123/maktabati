DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="wi<!dth=device-width, initial-scale=1.0">

    <title>الملازم الدراسية - مكتبتي الإلكترونية</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #243b55;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            font-size: 17px;
        }

        .back {
            max-width: 1100px;
            margin: 20px auto 0;
            padding: 0 20px;
        }

        .back a {
            text-decoration: none;
            color: #243b55;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin: 25px 0;
        }

        .notice {
            background: white;
            padding: 40px 25px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .notice .icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .notice h3 {
            margin: 10px 0;
            font-size: 23px;
        }

        .notice p {
            color: #666;
            line-height: 1.8;
            margin: 0;
        }

        footer {
            background: #243b55;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 27px;
            }

            .notice {
                padding: 30px 20px;
            }

        }

    </style>
</head>

<body>

    <header>

        <h1>🎓 الملازم الدراسية</h1>

        <p>
            ملازم دراسية لمختلف المراحل الدراسية
        </p>

    </header>


    <div class="back">

        <a href="index.html">
            ← العودة إلى الرئيسية
        </a>

    </div>


    <main>

        <h2>📚 الملازم الدراسية</h2>


        <div class="notice">

            <div class="icon">
                🎓
            </div>

            <h3>
                الملازم الدراسية
            </h3>

            <p>
                ستظهر هنا الملازم الدراسية لمختلف المراحل
                والتخصصات بعد إضافتها إلى المكتبة.
            </p>

    <footer>

        © 2026 مكتبتي الإلكترونية

    </footer>

</html>
