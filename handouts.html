<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>الملازم الدراسية - مكتبتي الإلكترونية</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #243b55;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            font-size: 17px;
        }

        .back {
            max-width: 1100px;
            margin: 20px auto 0;
            padding: 0 20px;
        }

        .back a {
            text-decoration: none;
            color: #243b55;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
        }

        h2 {
            text-align: center;
            margin: 25px 0;
        }

        .handouts {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(240px, 1fr)
            );
            gap: 20px;
        }

        .handout-card {
            background: white;
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .handout-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .handout-card h3 {
            margin: 10px 0;
            font-size: 22px;
        }

        .handout-card p {
            color: #666;
            line-height: 1.7;
        }

        .coming {
            display: inline-block;
            margin-top: 10px;
            background: #eef1f6;
            color: #555;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
        }

        .empty {
            background: white;
            border-radius: 16px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-top: 20px;
        }

        .empty .icon {
            font-size: 60px;
        }

        .empty h3 {
            margin: 15px 0 10px;
        }

        .empty p {
            color: #666;
            line-height: 1.8;
        }

        footer {
            background: #243b55;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 27px;
            }

            main {
                padding: 15px;
            }

        }

    </style>

</head>

<body>


    <header>

        <h1>
            🎓 الملازم الدراسية
        </h1>

        <p>
            ملازم دراسية لمختلف المراحل والتخصصات
        </p>

    </header>


    <div class="back">

        <a href="index.html">
            ← العودة إلى الرئيسية
        </a>

    </div>


    <main>

        <h2>
            📚 الملازم المتوفرة
        </h2>


        <div class="handouts">

            <div class="handout-card">

                <div class="handout-icon">
                    🎓
                </div>

                <h3>
                    ملازم دراسية
                </h3>

                <p>
                    ستتم إضافة الملازم الدراسية
                    هنا قريبًا.
                </p>

                <span class="coming">
                    قريبًا
                </span>

            </div>

        </div>


        <div class="empty">

            <div class="icon">
                📖
            </div>

            <h3>
                المكتبة قيد الإضافة
            </h3>

            <p>
                سيتم إضافة الملازم الدراسية
                وتنظيمها حسب المرحلة والتخصص
                عند تجهيز المحتوى.
            </p>

        </div>

    </main>


    <footer>

        © 2026 مكتبتي الإلكترونية

    </footer>


</body>

</html>
