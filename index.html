<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>مكتبتي الإلكترونية</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #243b55;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            font-size: 17px;
        }

        .search {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 20px;
            display: flex;
            gap: 10px;
        }

        .search input {
            flex: 1;
            padding: 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            text-align: right;
        }

        .search button {
            padding: 0 22px;
            border: none;
            border-radius: 12px;
            background: #243b55;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 10px 20px 40px;
        }

        h2 {
            text-align: center;
            margin: 25px 0;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px 20px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .card .icon {
            font-size: 45px;
        }

        .card h3 {
            margin: 15px 0 8px;
        }

        .card p {
            color: #666;
            margin-bottom: 20px;
        }

        .card a {
            text-decoration: none;
        }

        .card button {
            background: #243b55;
            color: white;
            border: none;
            padding: 11px 22px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        footer {
            background: #243b55;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            .search {
                flex-direction: column;
            }

            .search button {
                padding: 13px;
            }

            header h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 مكتبتي الإلكترونية</h1>
        <p>كتب وملازم دراسية في مكان واحد</p>
    </header>

    <div class="search">

        <input
            type="text"
            id="searchInput"
            placeholder="🔍 اكتب اسم الكتاب..."
        >

        <button onclick="searchBook()">
            بحث 🔎
        </button>

    </div>

    <main>

        <h2>أقسام المكتبة</h2>

        <div class="categories">

            <!-- الكتب -->
            <div class="card">

                <div class="icon">📚</div>

                <h3>الكتب</h3>

                <p>
                    مجموعة من الكتب المتنوعة
                </p>

                <a href="books.html">
                    <button>
                        تصفح الكتب
                    </button>
                </a>

            </div>


            <!-- الملازم الدراسية -->
            <div class="card">

    <div class="icon">🎓</div>

    <h3>الملازم الدراسية</h3>

    <p>
        ملازم لمختلف المراحل الدراسية
    </p>

    <a href="handouts.html">
        <button>
            تصفح الملازم
        </button>
    </a>

</div>

            </div>


            <!-- الكتب المجانية -->
            <div class="card">

                <div class="icon">🆓</div>

                <h3>الكتب المجانية</h3>

                <p>
                    كتب متاحة للقراءة والتحميل مجانًا
                </p>

                <button>
                    تصفح المجاني
                </button>

            </div>


            <!-- الكتب المدفوعة -->
            <div class="card">

                <div class="icon">💰</div>

                <h3>الكتب المدفوعة</h3>

                <p>
                    كتب مميزة متاحة للشراء
                </p>

                <a href="paid.html">
                    <button>
                        تصفح المدفوع
                    </button>
                </a>

            </div>

        </div>

    </main>


    <footer>
        © 2026 مكتبتي الإلكترونية
    </footer>


    <script>

        function searchBook() {

            let searchText =
                document
                .getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();

            if (
                searchText.includes("حكمت") ||
                searchText.includes("اليوم")
            ) {

                window.location.href = "book12.html";

            } else {

                alert("لم نجد هذا الكتاب في المكتبة");

            }

        }

    </script>

</body>

</html>
